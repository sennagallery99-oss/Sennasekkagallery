<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1A1817"/>
      <stop offset="100%" stop-color="#2D1A16"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D4AF37"/>
      <stop offset="25%" stop-color="#FFF8D6"/>
      <stop offset="50%" stop-color="#E2B452"/>
      <stop offset="75%" stop-color="#996515"/>
      <stop offset="100%" stop-color="#FCEAB3"/>
    </linearGradient>
    <linearGradient id="goldShine" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFDF0"/>
      <stop offset="50%" stop-color="#E2B452"/>
      <stop offset="100%" stop-color="#8B5A14"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#E2B452" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Luxury Dark Rounded Badge Background -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="url(#goldGrad)" stroke-width="3" opacity="0.4"/>

  <!-- Gold Emblem Scaled to Fit Favicon -->
  <g transform="matrix(0.58 0 0 0.58 256 256) translate(-500, -500)" filter="url(#glow)">
    <!-- Central Needle -->
    <line x1="500" y1="140" x2="500" y2="860" stroke="url(#goldShine)" stroke-width="7" stroke-linecap="round"/>
    
    <!-- Top & Bottom Stars -->
    <path d="M500 110 L510 140 L540 150 L510 160 L500 190 L490 160 L460 150 L490 140 Z" fill="url(#goldShine)"/>
    <path d="M500 810 L510 840 L540 850 L510 860 L500 890 L490 860 L460 850 L490 840 Z" fill="url(#goldShine)"/>

    <!-- Left S -->
    <path d="M 532 290
             C 532 290 530 220 440 220
             C 350 220 340 300 385 355
             C 435 410 575 490 575 620
             C 575 745 445 785 335 735
             C 245 695 240 600 240 600
             C 240 600 260 590 280 620
             C 305 675 375 715 445 700
             C 515 685 535 610 495 555
             C 445 495 305 420 305 310
             C 305 190 425 155 525 190
             Z"
          fill="url(#goldGrad)" stroke="url(#goldShine)" stroke-width="4"/>

    <!-- Right S -->
    <path d="M 640 400
             C 640 340 600 305 530 305
             C 490 305 460 325 450 345
             C 440 365 455 380 475 370
             C 495 360 515 350 540 350
             C 590 350 615 385 610 430
             C 600 495 490 570 470 630
             C 450 695 470 780 530 815
             C 600 850 670 790 675 710
             C 680 650 660 610 660 610
             C 660 610 645 625 640 650
             C 635 695 595 750 550 750
             C 510 750 495 710 505 675
             C 515 630 605 560 645 500
             C 670 460 675 425 640 400 Z"
          fill="url(#goldShine)" stroke="url(#goldGrad)" stroke-width="4"/>

    <!-- Center Sparkles -->
    <path d="M 500 515 L 512 545 L 542 555 L 512 565 L 500 595 L 488 565 L 458 555 L 488 545 Z" fill="url(#goldShine)"/>
  </g>
</svg>
