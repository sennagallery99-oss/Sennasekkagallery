<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" width="100%" height="100%">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#B8860B"/>
      <stop offset="25%" stop-color="#FFF4D0"/>
      <stop offset="50%" stop-color="#D4AF37"/>
      <stop offset="75%" stop-color="#8B5A14"/>
      <stop offset="100%" stop-color="#C5942B"/>
    </linearGradient>
    <linearGradient id="goldShine" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFDF0"/>
      <stop offset="35%" stop-color="#E2B452"/>
      <stop offset="70%" stop-color="#FCEAB3"/>
      <stop offset="100%" stop-color="#7A4D12"/>
    </linearGradient>
    <linearGradient id="needleGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#D4AF37"/>
      <stop offset="50%" stop-color="#FFFDE0"/>
      <stop offset="100%" stop-color="#996515"/>
    </linearGradient>
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#452605" flood-opacity="0.2"/>
    </filter>
  </defs>

  <!-- Background is transparent / clean white -->
  <g filter="url(#goldGlow)">
    <!-- Central Vertical Needle Axis -->
    <line x1="500" y1="140" x2="500" y2="860" stroke="url(#needleGrad)" stroke-width="4.5" stroke-linecap="round"/>

    <!-- Top Star Finial -->
    <path d="M500 120 L507 142 L528 150 L507 158 L500 180 L493 158 L472 150 L493 142 Z" fill="url(#goldShine)"/>

    <!-- Bottom Star Finial -->
    <path d="M500 820 L507 842 L528 850 L507 858 L500 880 L493 858 L472 850 L493 842 Z" fill="url(#goldShine)"/>

    <!-- Interlocking Left S -->
    <path d="M 532 290
             C 532 290 530 220 440 220
             C 350 220 340 300 385 355
             C 435 410 575 490 575 620
             C 575 745 445 785 335 735
             C 245 695 240 600 240 600
             C 240 600 260 590 280 620
             C 305 675 375 715 445 700
             C 515 685 535 610 495 555
             C 445 495 305 420 305 310
             C 305 190 425 155 525 190
             Z"
          fill="url(#goldGrad)" stroke="url(#goldShine)" stroke-width="2.5"/>

    <!-- Left S Upper Serif Finial -->
    <path d="M 525 188 L 532 290 L 505 250 Z" fill="url(#goldShine)"/>

    <!-- Left S Sweeping Loop -->
    <path d="M 335 735
             C 215 675 200 530 290 465
             C 335 430 385 440 400 460
             C 365 460 315 480 280 528
             C 240 578 250 665 335 735 Z"
          fill="url(#goldGrad)" opacity="0.85"/>

    <!-- Interlocking Right S -->
    <path d="M 640 400
             C 640 340 600 305 530 305
             C 490 305 460 325 450 345
             C 440 365 455 380 475 370
             C 495 360 515 350 540 350
             C 590 350 615 385 610 430
             C 600 495 490 570 470 630
             C 450 695 470 780 530 815
             C 600 850 670 790 675 710
             C 680 650 660 610 660 610
             C 660 610 645 625 640 650
             C 635 695 595 750 550 750
             C 510 750 495 710 505 675
             C 515 630 605 560 645 500
             C 670 460 675 425 640 400 Z"
          fill="url(#goldShine)" stroke="url(#goldGrad)" stroke-width="2.5"/>

    <!-- Right S Upper Horn Serif -->
    <path d="M 640 398 L 644 305 L 610 350 Z" fill="url(#goldGrad)"/>

    <!-- Right S Lower Tail -->
    <path d="M 470 695 L 464 820 L 496 770 Z" fill="url(#goldShine)"/>

    <!-- Center Diamond Sparkle -->
    <path d="M 500 520 L 508 544 L 532 552 L 508 560 L 500 584 L 492 560 L 468 552 L 492 544 Z" fill="url(#goldShine)"/>
    <path d="M 500 460 L 504 472 L 516 476 L 504 480 L 500 492 L 496 480 L 484 476 L 496 472 Z" fill="url(#goldGrad)" opacity="0.9"/>
  </g>

  <!-- Flanking Typography: SENNA & SEKKA in Luxury Serif Capitals -->
  <text x="70" y="555" font-family="'Cinzel', 'Playfair Display', 'Cormorant Garamond', 'Didot', 'Times New Roman', serif" font-size="88" letter-spacing="18" fill="url(#goldGrad)" font-weight="500">SENNA</text>
  <text x="690" y="555" font-family="'Cinzel', 'Playfair Display', 'Cormorant Garamond', 'Didot', 'Times New Roman', serif" font-size="88" letter-spacing="18" fill="url(#goldGrad)" font-weight="500">SEKKA</text>
</svg>
